<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!--
  The launch trailer's graphics (docs/design/trailer-production.md): render.mjs opens this
  page and calls window.draw(kind, params, frame) once a frame, then takes a screenshot.
  Every look is a pure function of the frame number, so a render is always the same.
-->
<style>
  @font-face { font-family: 'Pretendard'; src: url('../../public/assets/fonts/PretendardStdVariable.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Barlow Condensed'; src: url('../../public/assets/fonts/BarlowCondensed-600.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Barlow Condensed'; src: url('../../public/assets/fonts/BarlowCondensed-700.woff2') format('woff2'); font-weight: 700; }
  :root { --ink: #f2efe8; --amber: #e8a33a; --cyan: #22e4ff; --magenta: #ff2e88; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body.opaque { background: #0b0c0e; }
  #stage { position: absolute; inset: 0; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .layer { position: absolute; inset: 0; }
  .layer svg { position: absolute; }
  .presents { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.6em; color: rgba(242, 239, 232, 0.8); padding-left: 0.6em; }
  /* Type: Pretendard for Korean (800 display, 600 text), Barlow Condensed for numbers and the logo; warm white, amber accents. */
  .abs { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  .kicker { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--amber); }
  .kicker .dim { color: rgba(242, 239, 232, 0.38); }
  .kicker .hair { display: inline-block; width: 72px; height: 2px; margin: 0 22px 0 0; vertical-align: middle; background: rgba(232, 163, 58, 0.6); }
  .word { font-family: 'Pretendard', sans-serif; font-weight: 800; color: var(--ink); }
  .lineK { font-family: 'Pretendard', sans-serif; font-weight: 600; color: rgba(242, 239, 232, 0.6); letter-spacing: 0.32em; padding-left: 0.32em; }
  .hairline { position: absolute; left: 50%; height: 1px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, rgba(242, 239, 232, 0.45), transparent); }
  .title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-style: italic; letter-spacing: 0.03em; color: var(--ink); white-space: nowrap; }
  .free { display: inline-block; font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 0.3em; padding: 14px 38px 14px calc(38px + 0.3em); margin-right: 28px; color: var(--amber); border: 2px solid var(--amber); }
  .play { display: inline-block; font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 0.3em; padding: 16px 40px 16px calc(40px + 0.3em); color: #121315; background: var(--amber); }
  .url { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.32em; padding-left: 0.32em; color: rgba(242, 239, 232, 0.7); }
  .sub { position: absolute; left: 0; right: 0; bottom: 92px; text-align: center; font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 42px; color: #fff; letter-spacing: 0.005em;
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.7), 0 0 2px #000; }
  .ph-tag { position: absolute; left: 72px; top: 60px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.85); }
  .ph-tag b { color: var(--amber); margin-right: 18px; }
  .ph-desc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1300px; text-align: center; font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 44px; line-height: 1.5; color: rgba(255, 255, 255, 0.92); word-break: keep-all; }
  .ph-note { position: absolute; right: 72px; top: 64px; font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.5); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const FPS = 30;
  const stage = document.getElementById('stage');
  const svgs = {};
  /** render.mjs hands over the logo SVGs (as text) before drawing. */
  window.setSvgs = (m) => Object.assign(svgs, m);

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  /** A seeded number 0..1 for (frame, salt): glitches look random but render the same every time. */
  const rnd = (f, s) => { const x = Math.sin(f * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

  /** The bare mark inside one of the brand SVGs (no baked glitch bands) and its viewBox size. */
  const markOf = (svgText, id) => svgText.match(new RegExp(`<g id="${id}">([\\s\\S]*?)</g>`))[1];
  const boxOf = (svgText) => svgText.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/).slice(1).map(Number);
  const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  /** Film grain, the same for the same frame (mulberry32 seeded by it). */
  function grain(f) {
    const c = document.createElement('canvas');
    c.width = 960; c.height = 540;
    c.className = 'layer';
    Object.assign(c.style, { width: '1920px', height: '1080px', opacity: '0.05', mixBlendMode: 'screen' });
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(960, 540);
    let s = (f * 9973 + 17) >>> 0;
    for (let i = 0; i < img.data.length; i += 4) {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      const v = ((t ^ (t >>> 14)) >>> 0) % 256;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  /** An element with a class and text. */
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  /** The cards' backdrop (the opening's): near black, a faint warm light, vignette, grain. */
  function backdrop(f) {
    document.body.className = 'opaque';
    stage.style.background = 'radial-gradient(ellipse 1100px 600px at 50% 50%, rgba(232, 163, 58, 0.06), transparent 70%), #08090b';
    const vig = el('div', 'layer');
    vig.style.background = 'radial-gradient(ellipse at 50% 48%, transparent 45%, rgba(0, 0, 0, 0.6) 100%)';
    stage.append(vig, grain(f));
  }
  /** Rises into place from `dist` px down, `delay` frames late; `out` fades it at the end. */
  function rise(e, f, delay, out, dist = 18) {
    const k = ease((f - delay) / 7);
    e.style.opacity = String(k * out);
    e.style.transform = `translateY(${dist * (1 - k)}px)`;
  }
  /** The studio's horizontal lockup (bare marks, no glitch bands): emblem `h` px tall, centred at y. */
  function lockup(h, y) {
    const EM = markOf(svgs.emblem, 'gs-emblem');
    const WM = markOf(svgs.wordmark, 'gs-wordmark');
    const [ew] = boxOf(svgs.emblem);
    const [ww] = boxOf(svgs.wordmark);
    const se = h / ew;
    const sw = (h * 0.4) / 58;
    const gap = h * 0.32;
    const W = h + gap * 2 + 1 + ww * sw;
    const x0 = 960 - W / 2;
    return `<svg width="1920" height="1080" style="position:absolute;left:0;top:0" fill="#ebe7df">
      <g transform="translate(${x0},${y - h / 2}) scale(${se})">${EM}</g>
      <rect x="${x0 + h + gap}" y="${y - h * 0.3}" width="1" height="${h * 0.6}" opacity="0.4"/>
      <g transform="translate(${x0 + h + gap * 2 + 1},${y - 41 * sw}) scale(${sw})">${WM}</g></svg>`;
  }

  const draws = {
    /**
     * The GlitchedSpell opening (shots O1-O6, 0-5 s), a horizontal lockup: the emblem stamps in on the
     * 0.33 s hit with a shock ring, a short RGB tear on the 0.54 s hit, a hairline divider draws, the
     * wordmark wipes in from behind it with a soft edge, a light sweeps across, PRESENTS, then a last
     * tear and the picture folds shut like an old screen. One SVG a frame, page coordinates.
     */
    opening(p, f) {
      document.body.className = 'opaque';
      stage.style.background = '#060708';
      if (f < 10) return;
      const T = (a, b) => clamp((f - a) / (b - a));
      const EM = markOf(svgs.emblem, 'gs-emblem'), WM = markOf(svgs.wordmark, 'gs-wordmark');
      const [ew] = boxOf(svgs.emblem), [ww] = boxOf(svgs.wordmark);
      // Layout: emblem 230 px, divider, wordmark with a 76 px cap height (its box: baseline 70, cap 58).
      const E = 230, GAP = 54, se = E / ew, sw = 76 / 58, W = ww * sw;
      const total = E + GAP * 2 + 2 + W;
      const x0 = 960 - total / 2, cy = 520;
      const ecx = x0 + E / 2, dvx = x0 + E + GAP, wx = dvx + 2 + GAP;
      const INK = '#ebe7df';

      const stamp = ease(T(10, 16));
      const es = 1.1 - 0.1 * stamp;
      const shake = f < 13 ? (rnd(f, 5) - 0.5) * 8 : 0;
      const slide = -34 * (1 - ease(T(22, 54)));
      const reveal = wx - 60 + (W + 160) * easeIO(T(22, 50));
      let g = 0;
      if (f >= 16 && f < 21) g = 1 - (f - 16) / 5;
      if (f >= 51 && f < 54) g = 0.35;
      if (f >= 133 && f < 140) g = 0.55 + 0.45 * rnd(f, 9);
      const fold = easeIO(T(139, 146));
      const push = 1 + 0.03 * (f / 150);
      const sheenX = x0 - 320 + (total + 640) * easeIO(T(70, 104));

      const bands = [];
      const nb = g > 0 ? 3 + Math.floor(rnd(f, 1) * 3) : 0;
      for (let i = 0; i < nb; i++) {
        const y = cy - 130 + rnd(f, 10 + i) * 260, h = 3 + rnd(f, 20 + i) * 16;
        bands.push({ y, h, dx: (rnd(f, 30 + i) - 0.5) * 90 * g });
      }
      const keep = `M0,0H1920V1080H0Z ${bands.map((b) => `M0,${b.y}H1920V${b.y + b.h}H0Z`).join(' ')}`;

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;left:0;top:0">
        <defs>
          <linearGradient id="rv" gradientUnits="userSpaceOnUse" x1="${reveal - 70}" y1="0" x2="${reveal}" y2="0">
            <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
          <mask id="rvm" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="url(#rv)"/></mask>
          <g id="em"><g transform="translate(${ecx + shake},${cy}) scale(${se * es}) translate(${-ew / 2},${-ew / 2})">${EM}</g></g>
          <g id="wm" mask="url(#rvm)"><g transform="translate(${wx + slide},${cy - 41 * sw}) scale(${sw})">${WM}</g></g>
          <g id="all"><use href="#em"/><use href="#wm"/><rect x="${dvx}" y="${cy - 60 * ease(T(18, 34))}" width="2" height="${120 * ease(T(18, 34))}" opacity="0.32"/></g>
          <mask id="lk" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><use href="#em" fill="#fff"/><use href="#wm" fill="#fff"/></mask>
          <linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="${sheenX - 150}" y1="${cy - 90}" x2="${sheenX + 150}" y2="${cy + 90}">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <radialGradient id="back" cx="${ecx + total * 0.3}" cy="${cy}" r="${total * 0.75}" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#e8a33a" stop-opacity="0.075"/><stop offset="1" stop-color="#e8a33a" stop-opacity="0"/></radialGradient>
          <radialGradient id="bloom"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
          <clipPath id="keep"><path fill-rule="evenodd" d="${keep}"/></clipPath>
          ${bands.map((b, i) => `<clipPath id="b${i}"><rect x="0" y="${b.y}" width="1920" height="${b.h}"/></clipPath>`).join('')}
        </defs>
        <rect width="1920" height="1080" fill="url(#back)" opacity="${ease(T(10, 30))}"/>
        <g transform="translate(960 ${cy}) scale(${push * (1 + 0.14 * fold)} ${push * (1 - 0.992 * fold)}) translate(-960 ${-cy})">
          <circle cx="${ecx}" cy="${cy}" r="230" fill="url(#bloom)" opacity="${1 - T(10, 19)}"/>
          <circle cx="${ecx}" cy="${cy}" r="${122 + 190 * ease(T(10, 32))}" fill="none" stroke="${INK}" stroke-width="1.5" opacity="${0.45 * (1 - T(10, 32))}"/>
          ${g > 0.25 ? `<g style="mix-blend-mode:screen" opacity="${0.7 * g}"><use href="#all" fill="#22E4FF" transform="translate(${-9 * g},0)"/><use href="#all" fill="#FF2E88" transform="translate(${9 * g},0)"/></g>` : ''}
          <g clip-path="url(#keep)" opacity="${Math.min(1, (f - 10) / 2)}"><use href="#all" fill="${fold > 0 ? '#fff' : INK}"/></g>
          ${bands.map((b, i) => `<g clip-path="url(#b${i})"><use href="#all" fill="#22E4FF" opacity="0.9" transform="translate(${b.dx - 6},0)"/><use href="#all" fill="#FF2E88" opacity="0.9" transform="translate(${b.dx + 6},0)"/><use href="#all" fill="${INK}" transform="translate(${b.dx},0)"/></g>`).join('')}
          <g mask="url(#lk)"><rect width="1920" height="1080" fill="url(#sh)"/></g>
          <g mask="url(#lk)" filter="url(#soft)" opacity="0.5"><rect width="1920" height="1080" fill="url(#sh)"/></g>
        </g>
        ${f >= 146 ? `<rect x="${960 - total * 0.6 * (1 - T(146, 149))}" y="${cy - 1}" width="${total * 1.2 * (1 - T(146, 149))}" height="2" fill="#fff" opacity="${1 - T(146, 149)}"/>` : ''}
      </svg>`;
      const holder = document.createElement('div');
      holder.className = 'layer';
      holder.innerHTML = svg;
      stage.appendChild(holder);

      if (f >= 86 && f < 142) {
        const t = document.createElement('div');
        t.className = 'presents center';
        t.style.top = `${cy + 150}px`;
        t.style.fontSize = '27px';
        const k = ease(T(86, 112));
        t.style.letterSpacing = `${0.95 - 0.4 * k}em`;
        t.style.paddingLeft = `${0.95 - 0.4 * k}em`;
        t.style.opacity = String(0.72 * T(86, 100) * (1 - T(134, 140)));
        t.textContent = 'PRESENTS';
        stage.appendChild(t);
      }
      const vig = document.createElement('div');
      vig.className = 'layer';
      vig.style.background = 'radial-gradient(ellipse at 50% 48%, transparent 45%, rgba(0,0,0,0.65) 100%)';
      stage.appendChild(vig);
      stage.appendChild(grain(f));
    },
    /**
     * A card on the dark backdrop. `index` (1-4): the four arms, a numbered kicker over one wide-tracked
     * word and a hairline; `lines` (two): a tagline, the second line in amber; with `lead` a small
     * tracked line over a big one instead.
     */
    card(p, f, n) {
      backdrop(f);
      const out = clamp((n - 1 - f) / 4);
      const box = el('div', 'layer');
      box.style.transform = `scale(${1 + 0.035 * (f / n)})`;
      stage.appendChild(box);
      if (p.lines) {
        const [a, b] = p.lines;
        if (p.lead) {
          const l1 = el('div', 'abs lineK', a);
          Object.assign(l1.style, { top: '400px', fontSize: '38px' });
          rise(l1, f, 0, out);
          const l2 = el('div', 'abs word', b);
          Object.assign(l2.style, { top: '466px', fontSize: '132px', lineHeight: '1', letterSpacing: '0.12em', paddingLeft: '0.12em' });
          rise(l2, f, 2, out);
          box.append(l1, l2);
          return;
        }
        const l1 = el('div', 'abs word', a);
        Object.assign(l1.style, { top: '372px', fontSize: '112px', lineHeight: '1', letterSpacing: '0.06em' });
        rise(l1, f, 0, out);
        const l2 = el('div', 'abs word', b);
        Object.assign(l2.style, { top: '522px', fontSize: '112px', lineHeight: '1', letterSpacing: '0.06em', color: 'var(--amber)' });
        rise(l2, f, 5, out);
        box.append(l1, l2);
        return;
      }
      const reveal = ease(f / 7);
      const k = el('div', 'abs kicker');
      k.innerHTML = `0${p.index}<span class="hair" style="margin-left:22px"></span><span class="dim">04</span>`;
      Object.assign(k.style, { top: '392px', opacity: String(clamp(f / 5) * out) });
      const w = el('div', 'abs word', p.text);
      const track = 0.62 - 0.14 * ease(f / 14);
      Object.assign(w.style, {
        top: '452px',
        fontSize: '168px',
        lineHeight: '1',
        letterSpacing: `${track}em`,
        paddingLeft: `${track}em`,
        clipPath: `inset(0 ${50 - 50 * reveal}% 0 ${50 - 50 * reveal}%)`,
        opacity: String(out),
      });
      const r = el('div', 'hairline');
      Object.assign(r.style, { top: '676px', width: `${640 * ease((f - 3) / 12)}px`, opacity: String(out) });
      box.append(k, w, r);
    },
    /** STRIKEGY on the 128.15 s hit: slams in with a flash and a short colour tear, then pushes in slowly. */
    title(p, f, n) {
      backdrop(f);
      const slam = ease(f / 4);
      const s = 1.22 - 0.22 * slam + 0.05 * (f / n);
      const a = Math.min(1, slam * 1.5) * clamp((n - 1 - f) / 4);
      const tear = f < 5 ? 1 - f / 5 : 0;
      const make = (color, dx, op) => {
        const t = el('div', 'title center', 'STRIKEGY');
        Object.assign(t.style, { fontSize: '280px', color, opacity: String(op), transform: `translate(calc(-50% + ${dx}px), -54%) scale(${s})` });
        if (dx === 0) t.style.textShadow = '0 0 60px rgba(232, 163, 58, 0.28)';
        stage.appendChild(t);
      };
      if (tear > 0) {
        make('#22E4FF', -14 * tear, 0.7 * tear * a);
        make('#FF2E88', 14 * tear, 0.7 * tear * a);
      }
      make('var(--ink)', 0, a);
      const r = el('div', 'hairline');
      Object.assign(r.style, {
        top: '700px',
        height: '2px',
        width: `${900 * ease((f - 4) / 18)}px`,
        opacity: String(a),
        background: 'linear-gradient(90deg, transparent, rgba(232, 163, 58, 0.85), transparent)',
      });
      stage.appendChild(r);
      if (f < 3) {
        const fl = el('div', 'layer');
        fl.style.background = `rgba(255,255,255,${0.45 - f * 0.15})`;
        stage.appendChild(fl);
      }
    },
    /** End slate: STRIKEGY, the call to action, the address, the studio, all clear of the last line's subtitle. */
    endslate(p, f, n) {
      backdrop(f);
      const fade = clamp((n - 1 - f) / 30);
      const t = el('div', 'title abs', 'STRIKEGY');
      Object.assign(t.style, { top: '290px', fontSize: '210px', lineHeight: '1', textShadow: '0 0 50px rgba(232, 163, 58, 0.22)' });
      rise(t, f, 0, fade, 30);
      const play = el('div', 'abs');
      play.style.top = '548px';
      play.innerHTML = '<span class="free">무료 플레이</span><span class="play">지금 플레이</span>';
      rise(play, f, 5, fade);
      const url = el('div', 'abs url', 'strikegy.xyz');
      url.style.top = '658px';
      rise(url, f, 9, fade);
      const studio = el('div', 'layer');
      studio.innerHTML = lockup(64, 800);
      studio.style.opacity = String(0.75 * clamp((f - 14) / 10) * fade);
      stage.append(t, play, url, studio);
    },
    /** 일병 진급 (transparent, over S53): high in the frame, the private's bar becomes two and the rank's name changes. */
    promo(p, f, n) {
      document.body.className = '';
      const a = Math.min(clamp(f / 3), clamp((n - 1 - f) / 4));
      const shade = el('div', 'layer');
      shade.style.background = `radial-gradient(ellipse 560px 280px at 50% 250px, rgba(0,0,0,${0.55 * a}), transparent)`;
      stage.appendChild(shade);
      const two = f >= 7;
      const pop = two && f < 11 ? 1 + 0.18 * (1 - (f - 7) / 4) : 1;
      const bar = (y, op) => `<rect x="0" y="${y}" width="112" height="20" rx="2" fill="#E8A33A" opacity="${op}"/>`;
      const ins = el('div', 'abs');
      ins.style.top = '140px';
      ins.style.opacity = String(a);
      ins.innerHTML = `<svg width="112" height="62" style="transform:scale(${pop})">${two ? bar(6, 1) + bar(36, clamp((f - 7) / 2)) : bar(21, 1)}</svg>`;
      const k = el('div', 'abs kicker', '진급');
      Object.assign(k.style, { top: '226px', fontFamily: "'Pretendard', sans-serif", fontSize: '24px', opacity: String(a) });
      const w = el('div', 'abs word', two ? '일병' : '이병');
      Object.assign(w.style, { top: '262px', fontSize: '76px', letterSpacing: '0.24em', paddingLeft: '0.24em', opacity: String(a), textShadow: '0 2px 12px rgba(0,0,0,0.7)' });
      stage.append(ins, k, w);
    },
    /** One Korean subtitle line (transparent, bottom centre). */
    sub(p) {
      document.body.className = '';
      stage.appendChild(el('div', 'sub', p.text));
    },
    /** A stand-in for footage not shot yet: the shot's id and kind, what goes there. */
    placeholder(p) {
      document.body.className = '';
      stage.style.background = `radial-gradient(ellipse at 50% 45%, ${p.bg}, #0b0c0e 120%)`;
      const tag = el('div', 'ph-tag');
      tag.append(el('b', '', p.id), el('span', '', p.type));
      stage.append(tag, el('div', 'ph-note', '촬영 예정'), el('div', 'ph-desc', p.desc));
    },
  };

  window.draw = (kind, params, frame, frames) => {
    stage.replaceChildren();
    stage.style.background = '';
    draws[kind](params, frame, frames);
  };
</script>
</body>
</html>
